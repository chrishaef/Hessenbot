name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: Greet first-time contributors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Danke fürs Öffnen eines Issues bei **Hessenbot**!

            Bitte beschreibe Umgebung (OS, Python, Meshtastic), relevante `config.ini`-Abschnitte **ohne Passwörter/Secrets**, und was du erwartet hast vs. was passiert.

            Sicherheitsthemen: siehe [SECURITY.md](https://github.com/chrishaef/Hessenbot/blob/main/SECURITY.md).
          pr_message: |
            Danke für den Pull Request!

            Kurzchecklist: Fokus halten, keine Secrets committen, bei Verhaltens-/Config-Änderungen README oder `config.template` mitziehen, Tests wo sinnvoll (`pytest modules/test_blitzwatch.py`).

            Leitfaden: [CONTRIBUTING.md](https://github.com/chrishaef/Hessenbot/blob/main/CONTRIBUTING.md).
