# Radio profile (Phase 1: the only one). Sourced by the wizard.
RADIO_LABEL="RAK6421 HAT + RAK13302 (SX1262 + SKY66122, 1 W) in Slot 1, SPI"
# LoRa pin config shipped with the installer (radios.d/<file>), written 1:1 to /etc/meshtasticd/available.d/ under the
# name meshtasticd's HAT autoconf looks for (and linked into config.d). The stock lora-RAK6421-13302-slot1.yaml is not
# used: its CS line is commented out, which fails with "SX126x init result -2" when spi0-0cs is active.
RADIO_PRESET_FILE="lora-hat-rak-6421-pi-hat.yaml"
RADIO_REGION="EU_868"
RADIO_NEEDS_SPI=1
RADIO_NEEDS_I2C=1
# Ceiling (dBm) before subtracting antenna gain for lora.tx_power. The SX1262 chip itself reports ~22 dBm; the
# SKY66122 PA (about +13 dB) is switched via DIO2_AS_RF_SWITCH, so SX126X_MAX_POWER must not be set.
RADIO_TX_POWER_CAP=27
