# Radio profile (Phase 1: the only one). Sourced by the wizard.
RADIO_LABEL="RAK6421 HAT + RAK13302 (SX1262 + SKY66122, 1 W) in Slot 1, SPI"
# LoRa pin config shipped with the installer (radios.d/<file>), written 1:1 to /etc/meshtasticd/available.d/ under the
# name meshtasticd's HAT autoconf looks for (and linked into config.d). The stock lora-RAK6421-13302-slot1.yaml is not
# used: its CS line is commented out, which fails with "SX126x init result -2" when spi0-0cs is active.
RADIO_PRESET_FILE="lora-hat-rak-6421-pi-hat.yaml"
RADIO_REGION="EU_868"
RADIO_NEEDS_SPI=1
RADIO_NEEDS_I2C=1
# lora.tx_power (dBm, firmware setting). The installer sets no cap of its own: any value 0..RADIO_TX_POWER_MAX can be chosen
# ("max" = full power). The firmware limits the value to the region maximum (EU_868: ~27 dBm) unless HAM mode is on.
# 0 is not "off": the firmware then uses the region maximum, so it is treated like a high value.
# The SX1262 chip itself reports ~22 dBm; the SKY66122 PA (about +13 dB) is switched via DIO2_AS_RF_SWITCH, so the power
# at the antenna connector can be well above the setting (SX126X_MAX_POWER must not be set).
# Above RADIO_TX_POWER_EU_SAFE (and for 0) the wizard warns (EU 868 limits, regional rules) and needs explicit confirmation.
RADIO_TX_POWER_DEFAULT=14
RADIO_TX_POWER_EU_SAFE=14
RADIO_TX_POWER_MAX=30
